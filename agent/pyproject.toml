[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1,<2",
 "openai>=2,<3", "neo4j>=5.28,<6", "trino>=0.336,<1", "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]
