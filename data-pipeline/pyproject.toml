[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observability-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "neo4j>=5.28,<6"]

[project.scripts]
pipeline = "observability_pipeline.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/observability_pipeline"]
